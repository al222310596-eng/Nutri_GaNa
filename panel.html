<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control - Nutri GaNa</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <div>
                <h1>Nutri GaNa</h1>
                <p id="bienvenidaNutriologo"></p>
            </div>
            <button id="logoutBtn" class="btn btn-danger">Cerrar Sesión</button>
        </div>

        <div class="tabs">
            <button class="tab-btn active" data-tab="register">Registro de paciente</button>
            <button class="tab-btn" data-tab="consultation">Agendar Consulta</button>
            <button class="tab-btn" data-tab="history">Historial Clínico</button>
        </div>

        <div id="registerTab" class="tab-content active">
            <div class="form-container">
                <h2>Registro</h2>
                <form id="patientForm">
                    <div class="form-row">
                        <div class="form-group">
                            <label>Nombre Completo:</label>
                            <input type="text" id="nombrePaciente" required>
                        </div>
                        <div class="form-group">
                            <label>Edad (años):</label>
                            <input type="number" id="edadPaciente" required min="1" max="120">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Peso (kg):</label>
                            <input type="number" id="pesoPaciente" step="0.1" required>
                        </div>
                        <div class="form-group">
                            <label>Altura (m):</label>
                            <input type="number" id="alturaPaciente" step="0.01" required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-success">Calcular IMC y Guardar</button>
                </form>
                <div id="imcResult" class="imc-result"></div>
            </div>

            <div class="list-container">
                <h3>Pacientes Registrados</h3>
                <div id="listaPacientes" class="patient-list"></div>
            </div>
        </div>

        <div id="consultationTab" class="tab-content">
            <div class="form-container">
                <h2>Registrar Nueva Consulta</h2>
                <form id="consultationForm">
                    <div class="form-group">
                        <label>Seleccionar Paciente:</label>
                        <select id="selectPaciente" required>
                            <option value="">-- Seleccione un paciente --</option>
                        </select>
                    </div>
                    <div id="infoPaciente" class="patient-info"></div>
                    <div class="form-group">
                        <label>Evolución del Paciente:</label>
                        <textarea id="evolucion" rows="3" placeholder="Describa la evolución del paciente..." required></textarea>
                    </div>
                    <div class="form-group">
                        <label>Plan de Alimentación:</label>
                        <textarea id="planAlimentacion" rows="3" placeholder="Describa el plan de alimentación..." required></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">Guardar Consulta</button>
                </form>
            </div>
        </div>

        <div id="historyTab" class="tab-content">
            <div class="form-group">
                <label>Seleccionar Paciente:</label>
                <select id="selectPacienteHistorial" required>
                    <option value="">-- Seleccione un paciente --</option>
                </select>
            </div>
            <div id="historialConsultas" class="history-list"></div>
        </div>
    </div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
